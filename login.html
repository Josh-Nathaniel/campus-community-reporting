<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Campus Community Reporting</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="main-header"></header>

  <main class="main-content">
    <div class="container" style="max-width: 480px;">
      <div class="card" style="margin-top: 1rem;">
        <div style="text-align: center; margin-bottom: 1.5rem;">
          <h2>Welcome Back</h2>
          <p>Sign in to your campus reporting account</p>
        </div>

        <div id="login-alert"></div>

        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="login-email">Campus Email</label>
            <input type="email" id="login-email" class="form-control" placeholder="name@campus.edu" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
          </div>

          <button type="submit" id="login-btn" class="btn btn-primary btn-block">Sign In</button>
        </form>

        <!-- Hackathon Evaluator Quick-Fill Section -->
        <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border); font-size: 0.85rem;">
          <div style="font-weight: 700; color: var(--text-muted); margin-bottom: 0.5rem; text-align: center;">
            ⚡ Quick Demo Accounts (Hackathon Evaluators)
          </div>
          <div style="display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap;">
            <button type="button" class="btn btn-outline btn-sm" onclick="fillCredentials('student@campus.edu', 'Student@123')">
              Student 1 (Alex)
            </button>
            <button type="button" class="btn btn-outline btn-sm" onclick="fillCredentials('jordan@campus.edu', 'Student@123')">
              Student 2 (Jordan)
            </button>
            <button type="button" class="btn btn-outline btn-sm" onclick="fillCredentials('admin@campus.edu', 'Admin@123')">
              Administrator
            </button>
          </div>
        </div>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
          Don't have an account? <a href="register.html">Register here</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>Campus Community Reporting System &copy; 2026</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      redirectIfLoggedIn();
      renderNavbar("login");

      const form = document.getElementById("login-form");
      const alertEl = document.getElementById("login-alert");
      const submitBtn = document.getElementById("login-btn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        alertEl.innerHTML = "";

        const email = document.getElementById("login-email").value.trim();
        const password = document.getElementById("login-password").value;

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span> Authenticating...';

        const response = await apiPost("login", { email, password });

        submitBtn.disabled = false;
        submitBtn.innerHTML = "Sign In";

        if (response.success && response.data) {
          setCurrentUser(response.data);
          if (response.data.role === "admin") {
            window.location.href = "admin-dashboard.html";
          } else {
            window.location.href = "dashboard.html";
          }
        } else {
          alertEl.innerHTML = `<div class="alert alert-danger">${response.message || "Invalid credentials."}</div>`;
        }
      });
    });

    function fillCredentials(email, pass) {
      document.getElementById("login-email").value = email;
      document.getElementById("login-password").value = pass;
    }
  </script>
</body>
</html>
