<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account — Campus Community Reporting</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="main-header"></header>

  <main class="main-content">
    <div class="container" style="max-width: 520px;">
      <div class="card" style="margin-top: 1rem;">
        <div style="text-align: center; margin-bottom: 1.5rem;">
          <h2>Join Campus Reporting</h2>
          <p>Create your student or faculty account</p>
        </div>

        <div id="reg-alert"></div>

        <form id="register-form">
          <div class="form-group">
            <label class="form-label" for="reg-name">Full Name</label>
            <input type="text" id="reg-name" class="form-control" placeholder="e.g. Alex Rivera" required minlength="2">
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-email">Campus Email Address</label>
            <input type="email" id="reg-email" class="form-control" placeholder="alex.rivera@student.campus.edu" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-role">Role</label>
            <select id="reg-role" class="form-control" required>
              <option value="student" selected>🎓 Student / Community Member</option>
              <option value="admin">🛡️ Campus Administrator / Facilities Staff</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-password">Password (Minimum 6 characters)</label>
            <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required minlength="6">
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-confirm">Confirm Password</label>
            <input type="password" id="reg-confirm" class="form-control" placeholder="••••••••" required minlength="6">
          </div>

          <button type="submit" id="reg-btn" class="btn btn-primary btn-block">Create Account</button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
          Already have an account? <a href="login.html">Sign in here</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>Campus Community Reporting System &copy; 2026</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      redirectIfLoggedIn();
      renderNavbar("register");

      const form = document.getElementById("register-form");
      const alertEl = document.getElementById("reg-alert");
      const submitBtn = document.getElementById("reg-btn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        alertEl.innerHTML = "";

        const name = document.getElementById("reg-name").value.trim();
        const email = document.getElementById("reg-email").value.trim();
        const role = document.getElementById("reg-role").value;
        const password = document.getElementById("reg-password").value;
        const confirm = document.getElementById("reg-confirm").value;

        if (password !== confirm) {
          alertEl.innerHTML = '<div class="alert alert-danger">Passwords do not match. Please re-enter.</div>';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span> Creating Account...';

        const response = await apiPost("register", { name, email, password, role });

        submitBtn.disabled = false;
        submitBtn.innerHTML = "Create Account";

        if (response.success && response.data) {
          setCurrentUser(response.data);
          if (response.data.role === "admin") {
            window.location.href = "admin-dashboard.html";
          } else {
            window.location.href = "dashboard.html";
          }
        } else {
          alertEl.innerHTML = `<div class="alert alert-danger">${response.message || "Registration failed."}</div>`;
        }
      });
    });
  </script>
</body>
</html>
